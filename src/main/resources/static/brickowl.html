<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brick Tools - BrickOwl</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="container">
    <h1>BrickOwl orders</h1>

    <nav class="tabs">
      <button type="button" data-tab="stats" class="active">Statistics</button>
      <button type="button" data-tab="update">Update</button>
      <button type="button" data-tab="orders">Orders</button>
      <button type="button" data-tab="items">Order items</button>
    </nav>

    <section data-panel="stats">
      <p id="bo-stats-msg" class="warning"></p>
      <div class="grid" id="bo-totals"></div>
      <div id="bo-averages"></div>
      <div id="bo-histograms"></div>
    </section>

    <section data-panel="update" hidden>
      <section class="card">
        <h2>Update order data from BrickOwl</h2>
        <p class="muted">Fetches the orders more recent than the last stored one, with their items.</p>
        <button id="bo-update" class="btn" type="button">Update from BrickOwl</button>
        <p id="bo-update-msg" class="message"></p>
      </section>
    </section>

    <section data-panel="orders" hidden>
      <div class="table-wrap">
        <table class="data" id="bo-orders">
          <thead>
            <tr>
              <th class="sortable" data-key="Id">Order Id</th>
              <th class="sortable" data-key="OrderTime">Order time</th>
              <th class="sortable" data-key="StoreName">Store</th>
              <th class="sortable" data-key="Weight">Weight (kg)</th>
              <th class="sortable" data-key="TotalParts">Parts</th>
              <th class="sortable" data-key="TotalLots">Lots</th>
              <th class="sortable" data-key="PaidTotal">Paid</th>
              <th class="sortable" data-key="RefundTotal">Refund</th>
              <th class="sortable" data-key="Total">Total</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section data-panel="items" hidden>
      <p>
        <label>Order
          <select id="bo-order-select"></select>
        </label>
      </p>
      <div class="table-wrap">
        <table class="data" id="bo-items">
          <thead>
            <tr>
              <th class="part-image-col">Image</th>
              <th class="sortable" data-key="Type">Type</th>
              <th class="sortable" data-key="Name">Name</th>
              <th class="sortable" data-key="ColorName">Color</th>
              <th class="sortable" data-key="DesignIds">Design ids</th>
              <th class="sortable" data-key="ItemNumbers">Item numbers</th>
              <th class="sortable" data-key="Condition">Condition</th>
              <th class="sortable" data-key="Quantity">Quantity</th>
              <th class="sortable" data-key="ItemPrice">Unit price</th>
              <th class="sortable" data-key="TotalPrice">Total price</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/color.js"></script>
  <script src="js/modules/part-info.js"></script>
  <script src="js/modules/brickowl-shared.js"></script>
  <script src="js/modules/brickowl-stats.js"></script>
  <script src="js/modules/brickowl-orders.js"></script>
  <script src="js/brickowl.js"></script>
</body>
</html>
