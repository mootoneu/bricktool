<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brick Tools - Sets Purchase</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="container">
    <div class="toolbar">
      <h1>Sets purchases</h1>
      <button id="add-purchase" class="btn" type="button">Add purchase</button>
    </div>
    <p id="purchases-msg" class="warning"></p>

    <div id="purchases-filters" class="filters">
      <label>Name <input id="filter-name" type="search" placeholder="Contains…" autocomplete="off"></label>
      <label>Number <input id="filter-number" type="search" placeholder="Contains…" autocomplete="off"></label>
      <label>Reason <input id="filter-reason" type="search" placeholder="Contains…" autocomplete="off"></label>
      <label>Year from <input id="filter-year-min" type="number" min="0" placeholder="Min"></label>
      <label>Year to <input id="filter-year-max" type="number" min="0" placeholder="Max"></label>
      <label>Date from <input id="filter-date-min" type="date"></label>
      <label>Date to <input id="filter-date-max" type="date"></label>
      <label>Total parts min <input id="filter-parts-min" type="number" min="0" placeholder="Min"></label>
      <label>Total parts max <input id="filter-parts-max" type="number" min="0" placeholder="Max"></label>
      <label>Theme <select id="filter-theme"><option value="">All</option></select></label>
      <label>Vendor <select id="filter-vendor"><option value="">All</option></select></label>
      <label>Buyer <select id="filter-buyer"><option value="">All</option></select></label>
      <label>Owner <select id="filter-owner"><option value="">All</option></select></label>
      <label class="filter-check"><span><input type="checkbox" id="filter-owned"> Hide not owned</span></label>
      <div class="filter-actions">
        <button type="button" id="filter-reset" class="btn secondary">Reset filters</button>
      </div>
    </div>
    <p id="filter-summary" class="muted"></p>

    <div class="table-wrap">
      <table class="data fit" id="purchases">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div id="purchase-modal" class="modal" hidden>
    <form id="purchase-form">
      <h2 id="purchase-title">Add purchase</h2>
      <input type="hidden" id="purchase-id">
      <label>Set number <input id="f-setNumber" required></label>
      <label>Price (€) <input id="f-purchasePrice" type="number" step="0.01" min="0" required></label>
      <label>Purchase date (yyyy/MM/dd) <input id="f-purchaseDate" pattern="\d{4}/\d{2}/\d{2}" required></label>
      <label>Vendor <input id="f-vendor" list="vendor-options" autocomplete="off"></label>
      <label>Buyer <input id="f-broughtBy" list="buyer-options" autocomplete="off"></label>
      <label>Owner <input id="f-owner" list="owner-options" autocomplete="off"></label>
      <datalist id="vendor-options"></datalist>
      <datalist id="buyer-options"></datalist>
      <datalist id="owner-options"></datalist>
      <label>Parts missing <input id="f-partMissings" type="number" min="0" value="0"></label>
      <label><span><input type="checkbox" id="f-owned"> Owned</span></label>
      <label>Reason <input id="f-reason"></label>
      <p id="form-msg" class="warning"></p>
      <div class="form-actions">
        <button type="button" id="cancel-form" class="btn secondary">Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/purchases.js"></script>
</body>
</html>
