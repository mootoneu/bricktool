<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brick Tools - Sets Purchase</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="container">
    <div class="toolbar">
      <h1>Sets purchases</h1>
      <button id="add-purchase" class="btn" type="button" data-icon="add">Add purchase</button>
    </div>
    <p id="purchases-msg" class="warning"></p>

    <nav class="tabs">
      <button type="button" data-tab="statistics" class="active">Statistics</button>
      <button type="button" data-tab="list">Purchases</button>
      <button type="button" data-tab="sets">Sets</button>
      <button type="button" data-tab="set-inventory">Set Inventory</button>
    </nav>

    <section data-panel="statistics">
      <div class="grid">
        <div class="stat"><h3>Owned sets</h3><div class="value" id="stat-count">—</div></div>
        <div class="stat"><h3>Total price</h3><div class="value" id="stat-price">—</div></div>
        <div class="stat"><h3>Total parts</h3><div class="value" id="stat-parts">—</div></div>
        <div class="stat">
          <h3>Not owned sets</h3>
          <div class="value" id="stat-not-owned-count">—</div>
          <div class="stat-sub">Total price: <span id="stat-not-owned-price"></span></div>
        </div>
      </div>

      <div class="stats-charts">
        <section class="card">
          <h2>Sets per theme</h2>
          <div id="stat-theme-count"></div>
        </section>
        <section class="card">
          <h2>Price per theme</h2>
          <div id="stat-theme-price"></div>
        </section>
        <section class="card">
          <h2>Parts per theme</h2>
          <div id="stat-theme-parts"></div>
        </section>
      </div>

      <section class="card">
        <div class="chart-head">
          <h2>Per purchase year</h2>
          <div class="chart-filters" id="stat-filters">
            <label>Theme <select id="stat-theme"><option value="">All</option></select></label>
            <label>Buyer <select id="stat-buyer"><option value="">All</option></select></label>
            <label>Owner <select id="stat-owner"><option value="">All</option></select></label>
          </div>
        </div>
        <div id="stat-year"></div>
      </section>
    </section>

    <section data-panel="list" hidden>
      <div id="purchases-filters" class="filters">
        <label>Name <input id="filter-name" type="search" placeholder="Contains…" autocomplete="off"></label>
        <label>Number <input id="filter-number" type="search" placeholder="Contains…" autocomplete="off"></label>
        <label>Reason <input id="filter-reason" type="search" placeholder="Contains…" autocomplete="off"></label>
        <label>Year from <input id="filter-year-min" type="number" min="0" placeholder="Min"></label>
        <label>Year to <input id="filter-year-max" type="number" min="0" placeholder="Max"></label>
        <label>Date from <input id="filter-date-min" type="date"></label>
        <label>Date to <input id="filter-date-max" type="date"></label>
        <label>Total parts min <input id="filter-parts-min" type="number" min="0" placeholder="Min"></label>
        <label>Total parts max <input id="filter-parts-max" type="number" min="0" placeholder="Max"></label>
        <label>Theme <select id="filter-theme"><option value="">All</option></select></label>
        <label>Vendor <select id="filter-vendor"><option value="">All</option></select></label>
        <label>Buyer <select id="filter-buyer"><option value="">All</option></select></label>
        <label>Owner <select id="filter-owner"><option value="">All</option></select></label>
        <label class="filter-check"><span><input type="checkbox" id="filter-owned"> Hide not owned</span></label>
        <div class="filter-actions">
          <button type="button" id="filter-reset" class="btn secondary" data-icon="reset">Reset filters</button>
        </div>
      </div>
      <p id="filter-summary" class="muted"></p>

      <div class="table-wrap">
        <table class="data fit" id="purchases">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section data-panel="sets" hidden>
      <div id="ps-filters" class="filters">
        <label>Purchase year
          <span class="year-selector" role="group" aria-label="Purchase year">
            <button type="button" id="ps-year-prev" class="btn secondary icon-only" title="Previous year"
              aria-label="Previous year" data-icon="chevronLeft"></button>
            <select id="ps-year-value" class="year-selector-value" aria-label="Purchase year"></select>
            <button type="button" id="ps-year-next" class="btn secondary icon-only" title="Next year"
              aria-label="Next year" data-icon="chevronRight"></button>
          </span>
        </label>
        <label>Name <input id="ps-name" type="search" placeholder="Contains…" autocomplete="off"></label>
        <label>Theme <select id="ps-theme"><option value="">All</option></select></label>
        <label>Official price min <input id="ps-price-min" type="number" min="0" step="0.01" placeholder="Min"></label>
        <label>Official price max <input id="ps-price-max" type="number" min="0" step="0.01" placeholder="Max"></label>
        <div class="filter-actions">
          <button type="button" id="ps-reset" class="btn secondary" data-icon="reset">Reset filters</button>
        </div>
      </div>
      <p id="ps-summary" class="muted"></p>
      <div id="ps-cards" class="set-cards"></div>
    </section>

    <section data-panel="set-inventory" hidden>
      <div id="set-inventory-filters" class="filters set-inventory-toolbar">
        <label>Set <select id="set-inventory-set"><option value="">Select a set…</option></select></label>
        <label>Search <input id="set-inventory-search" type="search" placeholder="Part number, name, color…" autocomplete="off"></label>
        <label class="filter-check"><span><input type="checkbox" id="set-inventory-hide-complete"> Hide complete parts</span></label>
        <div class="filter-actions">
          <button type="button" id="set-inventory-clear" class="btn secondary" data-icon="clear">Clear actual</button>
          <button type="button" id="set-inventory-fill" class="btn secondary" data-icon="check">Set actual = expected</button>
          <button type="button" id="set-inventory-delete" class="btn danger" data-icon="delete">Delete inventory</button>
        </div>
      </div>
      <p id="set-inventory-msg" class="warning"></p>
      <p id="set-inventory-summary" class="muted"></p>
      <div class="table-wrap">
        <table class="data" id="set-inventory">
          <thead>
            <tr>
              <th class="part-image-col">Image</th>
              <th class="sortable" data-key="partNumber">Part number</th>
              <th class="sortable" data-key="partName">Part name</th>
              <th class="sortable" data-key="partCategory">Category</th>
              <th class="sortable" data-key="colorName">Color</th>
              <th class="sortable" data-key="expectedQut">Expected qty</th>
              <th class="sortable" data-key="actualQut">Actual qty</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="purchase-modal" class="modal" hidden>
    <form id="purchase-form">
      <h2 id="purchase-title">Add purchase</h2>
      <input type="hidden" id="purchase-id">
      <label>Set number <input id="f-setNumber" required></label>
      <label>Price (€) <input id="f-purchasePrice" type="number" step="0.01" min="0" required></label>
      <label>Purchase date (yyyy/MM/dd) <input id="f-purchaseDate" pattern="\d{4}/\d{2}/\d{2}" required></label>
      <label>Vendor <input id="f-vendor" list="vendor-options" autocomplete="off"></label>
      <label>Buyer <input id="f-broughtBy" list="buyer-options" autocomplete="off"></label>
      <label>Owner <input id="f-owner" list="owner-options" autocomplete="off"></label>
      <datalist id="vendor-options"></datalist>
      <datalist id="buyer-options"></datalist>
      <datalist id="owner-options"></datalist>
      <label>Parts missing <input id="f-partMissings" type="number" min="0" value="0"></label>
      <label><span><input type="checkbox" id="f-owned"> Owned</span></label>
      <label>Reason <input id="f-reason"></label>
      <p id="form-msg" class="warning"></p>
      <div class="form-actions">
        <button type="button" id="cancel-form" class="btn secondary" data-icon="close">Cancel</button>
        <button type="submit" class="btn" data-icon="save">Save</button>
      </div>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/modules/part-info.js"></script>
  <script src="js/sets.js"></script>
  <script src="js/modules/newsets-shared.js"></script>
  <script src="js/modules/purchases-shared.js"></script>
  <script src="js/modules/purchases-sets.js"></script>
  <script src="js/modules/purchases-table.js"></script>
  <script src="js/modules/purchases-stats.js"></script>
  <script src="js/modules/purchases-inventory.js"></script>
  <script src="js/purchases.js"></script>
</body>
</html>
